<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>খাবারের পেজ লোড হচ্ছে</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Noto+Sans+Bengali:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.hd{font-family:'Anek Bangla',sans-serif}
.sk{background:#ECECF1;position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,0.75),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
</style>
</helmet>
<div role="status" aria-busy="true" aria-label="লোড হচ্ছে" style="width:390px;height:1180px;box-sizing:border-box;background:#F6F6F8;color:#16161D;font-family:'Noto Sans Bengali',sans-serif;position:relative;overflow:hidden">

<header style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center">
<span style="width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:1px solid #E8E8EE;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16161D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></span>
<span style="display:flex;gap:8px"><span class="sk" style="width:44px;height:44px;border-radius:22px"></span><span class="sk" style="width:44px;height:44px;border-radius:22px"></span></span>
</header>

<section style="padding:4px 20px 0;display:flex;gap:16px;align-items:center">
<span class="sk" style="flex:0 0 96px;height:96px;border-radius:24px"></span>
<div style="flex:1">
<span class="sk" style="display:block;width:96px;height:22px;border-radius:8px"></span>
<span class="sk" style="display:block;width:120px;height:32px;border-radius:10px;margin-top:8px"></span>
<span class="sk" style="display:block;width:150px;height:14px;border-radius:7px;margin-top:10px"></span>
</div>
</section>

<section style="padding:18px 20px 0">
<div style="background:#FFFFFF;border:1px solid #E8E8EE;border-radius:24px;padding:18px">
<span class="sk" style="display:block;width:170px;height:40px;border-radius:10px"></span>
<span class="sk" style="display:block;height:8px;border-radius:4px;margin:14px 0 8px"></span>
<span class="sk" style="display:block;width:240px;height:14px;border-radius:7px;margin-top:12px"></span>
<div style="height:1px;background:#F0F0F4;margin:16px 0"></div>
<span class="sk" style="display:block;width:200px;height:20px;border-radius:8px;margin-bottom:12px"></span>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<span class="sk" style="height:84px;border-radius:18px"></span><span class="sk" style="height:84px;border-radius:18px"></span><span class="sk" style="height:84px;border-radius:18px"></span>
</div>
</div>
</section>

<section style="padding:22px 20px 0">
<h2 class="hd" style="margin:0 0 10px;font-size:21px;font-weight:600">কমিউনিটির প্রিয় জায়গা</h2>
<div style="background:#FFFFFF;border:1px solid #E8E8EE;border-radius:20px;padding:4px 14px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="{{r}}">
<span class="sk" style="width:32px;height:32px;border-radius:10px"></span>
<span><span class="sk" style="display:block;width:130px;height:16px;border-radius:8px"></span><span class="sk" style="display:block;width:180px;height:12px;border-radius:6px;margin-top:8px"></span></span>
<span class="sk" style="width:44px;height:24px;border-radius:10px"></span>
</div>
</sc-for>
</div>
</section>

<section style="padding:22px 20px 0">
<h2 class="hd" style="margin:0 0 10px;font-size:21px;font-weight:600">মানুষ যা বলছেন</h2>
<div style="background:#FFFFFF;border:1px solid #E8E8EE;border-radius:20px;padding:14px">
<div style="display:flex;align-items:center;gap:10px"><span class="sk" style="width:36px;height:36px;border-radius:18px"></span><span><span class="sk" style="display:block;width:110px;height:14px;border-radius:7px"></span><span class="sk" style="display:block;width:150px;height:12px;border-radius:6px;margin-top:6px"></span></span></div>
<span class="sk" style="display:block;height:14px;border-radius:7px;margin-top:16px"></span>
<span class="sk" style="display:block;width:70%;height:14px;border-radius:7px;margin-top:12px"></span>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
renderVals() {
const rows = [0, 1, 2].map((i) => 'display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:12px 0;' + (i < 2 ? 'border-bottom:1px solid #F0F0F4' : ''));
return { rows: rows };
}
}
</script>
</body>
</html>
