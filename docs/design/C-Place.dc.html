<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>জায়গার পেজ ও তথ্য যাচাই</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Noto+Sans+Bengali:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA}a:hover{color:#3730A3}
.hd{font-family:'Anek Bangla',sans-serif}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet{animation:sheetUp .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scrim{animation:fade .25s ease-out both}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}}
</style>
</helmet>
<div style="width:390px;height:1060px;box-sizing:border-box;background:#F6F6F8;color:#16161D;font-family:'Noto Sans Bengali',sans-serif;position:relative;overflow:hidden">

<header style="padding:14px 16px">
<a href="C-Food.dc.html" aria-label="পেছনে যান" style="width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:1px solid #E8E8EE;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16161D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
</header>

<section style="padding:0 20px">
<span style="font-size:14px;color:#5E5E6E">দোকান · শেরপুর রোড, বগুড়া</span>
<h1 class="hd" style="margin:2px 0 0;font-size:32px;font-weight:700;line-height:1.2">নমুনা দই ঘর</h1>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;gap:6px;background:#E9F8EF;color:#0E7A3D;border-radius:10px;padding:5px 10px;font-size:14px;font-weight:600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>চালু আছে · কমিউনিটি নিশ্চিত</span>
<span style="display:inline-flex;align-items:center;gap:6px;background:#EDEDF2;color:#3F3F4C;border-radius:10px;padding:5px 10px;font-size:14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>দাম ৩৪ দিন আগে নিশ্চিত</span>
</div>
</section>

<section style="padding:20px 20px 0">
<h2 class="hd" style="margin:0 0 10px;font-size:21px;font-weight:600">প্রথমবার? এগুলো অর্ডার করুন</h2>
<div style="background:#FFFFFF;border:1px solid #E8E8EE;border-radius:20px;padding:4px 14px">
<div style="display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #F0F0F4"><span style="width:52px;height:52px;border-radius:14px;background:#F3E6CC"></span><span><span style="display:block;font-weight:600">সরার দই</span><span style="font-size:13px;color:#5E5E6E">৳১৮০–৳২৫০</span></span><span style="background:#E9F8EF;color:#0E7A3D;border-radius:10px;padding:2px 8px;font-size:14px;font-weight:600">৯৬%</span></div>
<div style="display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0"><span style="width:52px;height:52px;border-radius:14px;background:#F6EEDD"></span><span><span style="display:block;font-weight:600">টক দই</span><span style="font-size:13px;color:#5E5E6E">৳১২০–৳১৬০</span></span><span style="background:#E9F8EF;color:#0E7A3D;border-radius:10px;padding:2px 8px;font-size:14px;font-weight:600">৮৯%</span></div>
</div>
</section>

<div class="scrim" style="position:absolute;inset:0;background:rgba(22,22,29,0.45)"></div>

<section class="sheet" role="dialog" aria-label="তথ্য যাচাই" style="position:absolute;left:0;right:0;bottom:0;background:#FFFFFF;border-radius:28px 28px 0 0;padding:10px 20px 24px">
<div style="width:40px;height:4px;border-radius:2px;background:#D9D9E0;margin:0 auto 16px"></div>
<div style="display:flex;justify-content:space-between;align-items:flex-start">
<h2 class="hd" style="margin:0;font-size:24px;font-weight:700">তথ্য ঠিক আছে?</h2>
<span style="display:inline-flex;align-items:center;gap:4px;background:#FFF7E6;color:#92400E;border-radius:10px;padding:3px 9px;font-size:13px;font-weight:600">যাচাই করলে +৫</span>
</div>
<p style="margin:4px 0 16px;font-size:16px;color:#5E5E6E">সরার দইয়ের দাম <b style="color:#16161D">৳১৮০–৳২৫০</b></p>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:#F6F6F8;border-radius:16px;padding:4px">
<button style="height:48px;border:0;border-radius:12px;background:transparent;font:inherit;font-size:15px;font-weight:600;color:#16161D">ঠিক</button>
<button style="height:48px;border:0;border-radius:12px;background:transparent;font:inherit;font-size:15px;font-weight:600;color:#16161D">আংশিক</button>
<button aria-pressed="true" style="height:48px;border:0;border-radius:12px;background:#FFFFFF;box-shadow:0 1px 3px rgba(22,22,29,0.12);font:inherit;font-size:15px;font-weight:700;color:#B4232A">ভুল</button>
</div>
<p style="margin:18px 0 8px;font-size:15px;font-weight:600">কোনটা ভুল?</p>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<button style="height:40px;border:1px solid #E8E8EE;border-radius:20px;background:#FFFFFF;padding:0 14px;font:inherit;font-size:14px;color:#16161D">খাবার পাওয়া যায় না</button>
<button aria-pressed="true" style="height:40px;border:0;border-radius:20px;background:#4F46E5;padding:0 14px;font:inherit;font-size:14px;color:#FFFFFF;display:flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>দাম ভুল</button>
<button style="height:40px;border:1px solid #E8E8EE;border-radius:20px;background:#FFFFFF;padding:0 14px;font:inherit;font-size:14px;color:#16161D">ঠিকানা ভুল</button>
<button style="height:40px;border:1px solid #E8E8EE;border-radius:20px;background:#FFFFFF;padding:0 14px;font:inherit;font-size:14px;color:#16161D">জায়গা বন্ধ</button>
<button style="height:40px;border:1px solid #E8E8EE;border-radius:20px;background:#FFFFFF;padding:0 14px;font:inherit;font-size:14px;color:#16161D">অন্য কিছু</button>
</div>
<label for="fix" style="display:block;margin:18px 0 6px;font-size:15px;font-weight:600">এখনকার দাম কত? <span style="font-weight:400;color:#5E5E6E">(ঐচ্ছিক)</span></label>
<input id="fix" value="৳২২০–৳২৮০" style="width:100%;box-sizing:border-box;height:52px;border:1px solid #E8E8EE;background:#F6F6F8;border-radius:14px;padding:0 14px;font:inherit;font-size:16px;color:#16161D">
<button style="margin-top:10px;display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 0;font:inherit;font-size:14px;font-weight:600;color:#16161D"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="3"></rect><circle cx="12" cy="13" r="3.5"></circle></svg>প্রমাণ হিসেবে ছবি বা লিংক দিন</button>
<button style="margin-top:12px;width:100%;height:56px;border:0;border-radius:18px;background:#4F46E5;color:#FFFFFF;font:inherit;font-size:17px;font-weight:600">জমা দিন</button>
</section>
</div>
</x-dc>
