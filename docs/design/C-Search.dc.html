<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>সার্চ ফলাফল — কাচ্চি</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&amp;family=Noto+Sans+Bengali:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA}a:hover{color:#3730A3}
.hd{font-family:'Anek Bangla',sans-serif}
</style>
</helmet>
<div style="width:390px;height:1000px;box-sizing:border-box;background:#F6F6F8;color:#16161D;font-family:'Noto Sans Bengali',sans-serif;position:relative;overflow:hidden">

<header style="padding:14px 16px 0;display:flex;gap:10px;align-items:center">
<a href="Main.dc.html" aria-label="পেছনে যান" style="flex:0 0 auto;width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:1px solid #E8E8EE;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16161D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
<label for="sq" style="flex:1;display:flex;align-items:center;gap:8px;background:#FFFFFF;border:2px solid #4F46E5;border-radius:16px;padding:0 12px;height:48px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input id="sq" value="kacchi" style="border:0;outline:0;flex:1;font:inherit;font-size:16px;color:#16161D;background:transparent">
<button aria-label="মুছে ফেলুন" style="width:28px;height:28px;border-radius:14px;border:0;background:#EDEDF2;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5E5E6E" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</label>
</header>
<p style="margin:10px 20px 0;font-size:14px;color:#5E5E6E">দেখাচ্ছি <b style="color:#16161D">কাচ্চি</b>-র ফলাফল</p>

<div style="margin:12px 16px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:#EDEDF2;border-radius:14px;padding:4px">
<button aria-pressed="true" style="height:40px;border:0;border-radius:10px;background:#FFFFFF;box-shadow:0 1px 3px rgba(22,22,29,0.1);font:inherit;font-size:14px;font-weight:600;color:#16161D">সব</button>
<button style="height:40px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:14px;color:#5E5E6E">খাবার</button>
<button style="height:40px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:14px;color:#5E5E6E">জায়গা</button>
<button style="height:40px;border:0;border-radius:10px;background:transparent;font:inherit;font-size:14px;color:#5E5E6E">জেলা</button>
</div>
<div style="margin:10px 16px 0;display:flex;gap:8px">
<button style="height:36px;border:1px solid #E8E8EE;border-radius:18px;background:#FFFFFF;padding:0 12px;font:inherit;font-size:14px;color:#16161D;display:flex;align-items:center;gap:6px">দাম<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5E5E6E" stroke-width="2.6" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button>
<button style="height:36px;border:0;border-radius:18px;background:#EEF0FF;padding:0 12px;font:inherit;font-size:14px;font-weight:600;color:#3730A3;display:flex;align-items:center;gap:6px">রেস্টুরেন্ট<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3730A3" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<button style="height:36px;border:1px solid #E8E8EE;border-radius:18px;background:#FFFFFF;padding:0 12px;font:inherit;font-size:14px;color:#16161D">স্ট্রিট ফুড</button>
</div>

<section style="padding:20px 16px 0">
<h2 class="hd" style="margin:0 0 8px;font-size:17px;font-weight:600;color:#5E5E6E">খাবার</h2>
<a href="C-Food.dc.html" style="text-decoration:none;color:#16161D;display:flex;align-items:center;gap:12px;background:#FFFFFF;border:1px solid #E8E8EE;border-radius:20px;padding:12px">
<span style="flex:0 0 56px;height:56px;border-radius:16px;background:#EAD7C4"></span>
<span style="flex:1"><span class="hd" style="display:block;font-size:19px;font-weight:700">কাচ্চি</span><span style="font-size:14px;color:#5E5E6E">৪২টা জায়গায় পাওয়া যায় · ঢাকার বিখ্যাত</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</section>

<section style="padding:20px 16px 0">
<h2 class="hd" style="margin:0 0 8px;font-size:17px;font-weight:600;color:#5E5E6E">কাচ্চি পাওয়া যায় এমন জায়গা</h2>
<div style="background:#FFFFFF;border:1px solid #E8E8EE;border-radius:20px;padding:4px 14px">
<sc-for list="{{places}}" as="p" hint-placeholder-count="4">
<a href="C-Place.dc.html" style="{{p.row}}">
<span style="width:52px;height:52px;border-radius:14px;background:{{p.bg}}"></span>
<span style="min-width:0"><span style="display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.name}}</span><span style="display:block;font-size:13px;color:#5E5E6E">{{p.meta}}</span></span>
<span style="text-align:right"><span style="{{p.pill}}">{{p.score}}</span><span style="display:block;font-size:12px;color:#5E5E6E;margin-top:2px">{{p.count}}</span></span>
</a>
</sc-for>
</div>
</section>

<section style="padding:20px 16px 0">
<h2 class="hd" style="margin:0 0 8px;font-size:17px;font-weight:600;color:#5E5E6E">জেলা</h2>
<a href="C-District.dc.html" style="text-decoration:none;color:#16161D;display:flex;align-items:center;gap:12px;background:#FFFFFF;border:1px solid #E8E8EE;border-radius:20px;padding:12px 14px">
<span style="flex:0 0 40px;height:40px;border-radius:12px;background:#EEF0FF;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg></span>
<span style="flex:1"><span style="display:block;font-size:16px;font-weight:600">ঢাকা</span><span style="font-size:13px;color:#5E5E6E">কাচ্চি, বাকরখানি, মোরগ পোলাও</span></span>
</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
['[দোকানের নাম]', 'পুরান ঢাকা · ৳২৮০–৳৩৮০', '৯৩%', '৬২০ জন', '#EAD7C4', true],
['[দোকানের নাম]', 'ধানমন্ডি · ৳৩২০–৳৪২০', '৮৯%', '৪১৫ জন', '#F0E0CC', true],
['[দোকানের নাম]', 'মিরপুর ১০ · ৳২৬০–৳৩২০', '৮৪%', '১৯০ জন', '#E6D3BC', true],
['[দোকানের নাম]', 'আগ্রাবাদ, চট্টগ্রাম', 'নতুন', '২ জন', '#F2E6D6', false]
];
const places = rows.map(([name, meta, score, count, bg, ok], i) => ({
name: name, meta: meta, score: score, count: count, bg: bg,
row: 'text-decoration:none;color:#16161D;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;' + (i < rows.length - 1 ? 'border-bottom:1px solid #F0F0F4' : ''),
pill: 'display:inline-block;border-radius:10px;padding:2px 8px;font-size:14px;font-weight:600;' + (ok ? 'background:#E9F8EF;color:#0E7A3D' : 'background:#EDEDF2;color:#3F3F4C')
}));
return { places: places };
}
}
</script>
</body>
</html>
