# Installed in Phase 0.3 as .github/workflows/ci.yml
# Runs on every PR, and is called by deploy.yml on every push to main. All checks must pass before merge (branch protection).
name: CI
on:
  pull_request:
  workflow_call:   # deploy.yml runs this same CI before deploying to production
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:themes
      - run: pnpm build
        env:
          # CI build uses a mock data layer so it never touches real projects (see docs/03-architecture.md)
          DB_PROVIDER: mock
          NEXT_PUBLIC_STORAGE_PROVIDER: mock
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { DB_PROVIDER: mock, NEXT_PUBLIC_STORAGE_PROVIDER: mock }
      - name: Lighthouse budgets
        run: pnpm dlx @lhci/cli@0.15.x autorun
        env: { DB_PROVIDER: mock, NEXT_PUBLIC_STORAGE_PROVIDER: mock }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
